        <main>
            <section class="contact-section bg-img" style="background-image: url('./images/contact/contact.png')">
                <div class="container">
                    <div class="row">
                        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                            <article class="contact-content bg-img-color p-3 ps-lg-0 animation" data-animation='slide-right'>
                                <h1 class="contact-title mb-4">
                                    Contact Us
                                </h1>
                                <div class="contact-data animation" data-animation="slide-top">
                                    <p>
                                        <span class="fa-solid fa-location-dot contact-icon"></span>
                                        <span>146 Douglas Dale Suite 343</span>
                                    </p>
                                    <p>
                                        <span class="fa-solid fa-phone contact-icon"></span>
                                        <a href="tel:560-748-5959">560-748-5959</a>
                                    </p>
                                    <p>
                                        <span class="fa-regular fa-envelope contact-icon"></span>
                                        <a href="mailto:cullen_mueller@yahoo.com">cullen_mueller@yahoo.com</a>
                                    </p>
                                </div>
                            </article>
                        </div>
                    </div>
                </div>
            </section>
            <section class="contact-form-section">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                            <article class="contact-form-data">
                                <h2 class="contact-form-section-title text-center">
                                    Please contact us using the form bellow
                                </h2>
                                <form class="contact-form" method="get" action="">
                                    <div class="form-group">
                                        <input type="text" name="contact_name" value="" class="form-control" placeholder="Name and surname*">
                                        <div class="invalid-feedback"></div>
                                    </div>
                                    <div class="form-group">
                                        <input type="email" name="contact_email" value="" class="form-control" placeholder="Email address*">
                                        <div class="invalid-feedback"></div>
                                    </div>
                                    <div class="form-group">
                                        <textarea class="form-control" name="contact_message" rows="5" placeholder="Enter your message*"></textarea>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                    <div class="form-group text-center">
                                        <button type="submit" name="send" value="yes" class="btn btn-primary rounded-pill px-5 py-3 text-uppercase fw-medium">send message</button>
                                    </div>
                                </form>
                            </article>
                        </div>
                    </div>
                </div>
            </section>
            <section class="contact-map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d22642.71627735148!2d20.4026242!3d44.8146471!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x475a7aa3d7b53fbd%3A0x1db8645cf2177ee4!2sBelgrade!5e0!3m2!1sen!2srs!4v1755636864394!5m2!1sen!2srs" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
